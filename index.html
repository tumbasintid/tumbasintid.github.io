<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saka Store - Akun Advance Server MLBB</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <div id="app">
        <!-- Header Sticky -->
        <header class="navbar">
            <button class="menu-btn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="flag-icon">
                <img src="https://flagcdn.com/w40/id.png" alt="Indonesia Flag">
            </div>
        </header>

        <!-- Store Profile Section -->
        <section class="store-profile">
            <!-- Cover / Banner Store -->
            <div class="profile-cover">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Store Banner">
            </div>

            <!-- Content Detail -->
            <div class="profile-details">
                <!-- Avatar Logo -->
                <div class="avatar-wrapper">
                    <img src="https://ui-avatars.com/api/?name=Saka+Store&background=FFCC00&color=121824&bold=true&size=128" alt="Saka Store Logo" class="profile-avatar">
                </div>

                <!-- Title & Verified Badge -->
                <div class="profile-heading">
                    <h1 class="store-name">Saka Store</h1>
                    <svg class="verified-badge" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#3897f0" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.3-6.3 1.5 1.5-7.8 7.8z"/>
                    </svg>
                </div>

                <!-- Bio / Deskripsi -->
                <p class="store-bio">Penyedia Akun Advance Server MLBB Terpercaya, Murah & Proses Otomatis ⚡</p>

                <!-- Tombol Berdampingan -->
                <div class="action-buttons">
                    <a href="#katalog" class="btn-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>
                        </svg>
                        <span>Lihat Produk</span>
                    </a>

                    <a href="#cara-order" class="btn-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 8l-8-5-8 5v8l8 5 8-5V8zm-8-2.73L17.17 8 12 10.73 6.83 8 12 5.27zM5 9.58l6 3.15v6.69l-6-3.15V9.58zm14 9.99l-6 3.15v-6.69l6-3.15v6.69z"/>
                        </svg>
                        <span>Cara Order</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Placeholder Area Katalog -->
        <div id="katalog" class="katalog-placeholder">
            <p>-- Katalog Produk Akan Tampil di Sini --</p>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Beranda</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 9h2V6h3V4h-3V1h-2v3H8v2h3v3zm-4 9c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm-9.83-3.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.17-2.25z"/></svg>
                <span>Store</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>Info</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/><circle cx="12" cy="18" r="2"/></svg>
                <span>Admin</span>
            </a>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
