<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Input Stok Akun</title>
  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #121212; color: #fff; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
    h2 { text-align: center; margin-top: 0; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #333; box-sizing: border-box; }
    input, select { background: #2a2a2a; color: #fff; }
    button { background: #28a745; color: #fff; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.95rem; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Input Stok Akun</h2>
    <form id="stockForm" onsubmit="return false;">
      <label>Kategori Produk</label>
      <select id="category" required>
        <option value="">-- Pilih Kategori --</option>
        <option value="Level 3">Advance Server Level 3</option>
        <option value="Level 20">Advance Server Level 20</option>
      </select>

      <label>Email / Username Akun</label>
      <input type="text" id="accountData" placeholder="user1@gmail.com" required>

      <label>Password Akun</label>
      <input type="text" id="passwordData" placeholder="pass123" required>

      <button type="button" id="btnSave">Simpan ke Database</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://rjgkxqzecrsczcmuamhd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NkdjOyOxw5TIBI0VpXDq7A_ypDhxts5";
    
    // Inisialisasi client Supabase
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('btnSave').addEventListener('click', async () => {
      const msgDiv = document.getElementById('msg');
      const category = document.getElementById('category').value;
      const accountData = document.getElementById('accountData').value;
      const passwordData = document.getElementById('passwordData').value;

      if (!category || !accountData || !passwordData) {
        msgDiv.style.color = "yellow";
        msgDiv.innerText = "Mohon isi semua kolom terlebih dahulu!";
        return;
      }

      msgDiv.style.color = "#00bfff";
      msgDiv.innerText = "Sedang menyimpan ke Supabase...";

      try {
        const { data, error } = await supabaseClient
          .from('accounts')
          .insert([{ 
            category: category, 
            account_data: accountData, 
            password_data: passwordData, 
            is_sold: false 
          }]);

        if (error) {
          msgDiv.style.color = "#ff4d4d";
          msgDiv.innerText = "Gagal Simpan: " + error.message;
        } else {
          msgDiv.style.color = "#00ff7f";
          msgDiv.innerText = "SUKSES! Stok " + category + " berhasil disimpan!";
          document.getElementById('stockForm').reset();
        }
      } catch (err) {
        msgDiv.style.color = "#ff4d4d";
        msgDiv.innerText = "Terjadi Kesalahan: " + err.message;
      }
    });
  </script>

</body>
</html>
